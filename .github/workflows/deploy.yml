name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - felipe-mejoras
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular App
        run: npx ng build --configuration production --base-href /Innova-Web/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/innova/browser
          branch: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}